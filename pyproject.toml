[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qnnbench"
version = "0.1.0"
description = "Batched PyTorch state-vector simulation of quantum neural networks, with CPU/GPU benchmarks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anna Payne" }]
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "tomli>=2; python_version < '3.11'",  # tomllib backport for config files
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ruff>=0.5",
    "cirq-core>=1.3",   # reference simulator for correctness tests
]
bench = [
    "matplotlib>=3.8",
    "pennylane>=0.36",  # framework comparison baseline
]
serve = [
    "fastapi>=0.110",
    "prometheus-client>=0.20",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qnnbench"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Suites build closures over loop variables and call them within the same iteration.
"src/qnnbench/bench/suites.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # cirq, pennylane, prometheus_client ship partial or no stubs

[tool.coverage.run]
source = ["qnnbench"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# CUDA-only branches (streams, CUDA events, NCCL) cannot run on CPU CI runners.
fail_under = 70
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: downloads MNIST (skipped when offline)",
    "slow: takes more than a few seconds",
]

# Locked installs (`uv sync`, CI) use CPU-only PyTorch: no GPU there, and the
# CUDA wheels are ~2 GB larger. On a GPU machine install with
# `uv pip install -e ".[...]" --no-sources` (or use the Docker image) to get
# the CUDA build from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
