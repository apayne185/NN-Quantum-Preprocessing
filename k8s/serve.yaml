# QNN inference service with micro-batching on a GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qnnbench-serve
  labels: {app: qnnbench, component: serve}
spec:
  replicas: 1
  selector:
    matchLabels: {app: qnnbench, component: serve}
  template:
    metadata:
      labels: {app: qnnbench, component: serve}
    spec:
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: serve
          image: ghcr.io/apayne185/qnnbench:latest
          command: ["uvicorn", "qnnbench.serve:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {containerPort: 8000, name: http}
          env:
            - {name: QNNBENCH_MAX_BATCH, value: "64"}
            - {name: QNNBENCH_MAX_WAIT_MS, value: "5"}
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {nvidia.com/gpu: 1, memory: 4Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: qnnbench-serve
spec:
  selector: {app: qnnbench, component: serve}
  ports:
    - {port: 80, targetPort: http, name: http}
