name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); Dependabot bumps them.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --extra serve --extra bench
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python }}
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked --extra dev --extra serve --extra bench
      - name: Cache MNIST
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/mnist.npz
          key: mnist-731c5ac6
      - name: Tests with coverage (fails under the floor in pyproject.toml)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  bench-smoke:
    # Catches benchmark code that crashes. Timings on shared runners are too
    # noisy to gate on; use `qnnbench.bench.compare` on dedicated hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --extra bench
      - run: uv run python -m qnnbench.bench qubits batch fusion grad dtype quanv --quick
      - run: uv run python -m qnnbench.profile --n-qubits 9 --steps 1 --out runs/profile

  audit:
    # Known vulnerabilities in the locked dependency set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Export locked requirements
        # "+cpu" local versions are not on PyPI; audit the same torch release instead.
        run: |
          uv export --frozen --no-hashes --no-emit-project \
            --extra dev --extra serve --extra bench | sed 's/+cpu//' > requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --progress-spinner off

  k8s:
    # Schema-validate every manifest (strict), including the kustomized stack
    # and the Kubeflow PyTorchJob CRD.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          python3 -m pip install --quiet pyyaml
      - run: k8s/validate.sh
